<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SO Manager">
<title>SO Manager</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html{font-size:16px;height:100%;-webkit-text-size-adjust:100%}
body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Arial,sans-serif;overflow:hidden;background:var(--bg)}

:root{
  --bg:#f2f2f7;--surface:#fff;
  --s2:rgba(118,118,128,.12);--s3:rgba(118,118,128,.07);
  --border:rgba(60,60,67,.13);--b2:rgba(60,60,67,.07);
  --text:#1c1c1e;--t2:#3a3a3c;--t3:#6d6d72;--t4:#aeaeb2;
  --blue:#007aff;--bl:rgba(0,122,255,.1);
  --green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;
  --sh:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --hh:56px;--bnh:env(safe-area-inset-bottom,0px);
}
body.dark{
  --bg:#1c1c1e;--surface:#2c2c2e;
  --s2:rgba(255,255,255,.1);--s3:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.15);--b2:rgba(255,255,255,.08);
  --text:#f2f2f7;--t2:#ebebf5;--t3:#aeaeb2;--t4:#636366;
  --sh:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
}

/* ── SPLASH ── */
.splash{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:220px;transition:opacity .4s ease}
.splash-logo{width:130px;height:130px;display:flex;align-items:center;justify-content:center}
.splash-logo img{width:100%;height:100%;object-fit:contain}
body.dark .splash-logo img{filter:invert(1)}
.splash-label{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;letter-spacing:3px;color:var(--t4);text-transform:uppercase}
.splash.hide{opacity:0;pointer-events:none}

/* ── LOGIN ── */
.login-screen{position:fixed;inset:0;z-index:8000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:0}
.login-logo{width:80px;height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.login-logo img{width:100%;height:100%;object-fit:contain}
body.dark .login-logo img{filter:invert(1)}
.login-title{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.5px;margin-bottom:6px}
.login-sub{font-size:15px;color:var(--t3);margin-bottom:44px;text-align:center}
.google-btn{
  display:flex;align-items:center;gap:12px;padding:14px 24px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
  font-size:16px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;
  box-shadow:var(--sh);width:100%;max-width:320px;justify-content:center;
  transition:opacity .15s;
}
.google-btn:active{opacity:.7}
.dark-toggle-login{margin-top:16px;padding:10px 20px;border:none;background:var(--s2);border-radius:10px;font-size:14px;color:var(--t3);cursor:pointer;font-family:inherit}

/* ── HEADER ── */
.header{position:fixed;top:0;left:0;right:0;z-index:300;height:var(--hh);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);display:none;align-items:center;justify-content:space-between;padding:0 16px;transition:border-color .25s}
.header.show{display:flex}
.hdr-left{display:flex;flex-direction:column}
.hdr-title{font-size:17px;font-weight:700;color:var(--text)}
.hdr-date{font-size:12px;color:var(--t3);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--s2);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.user-btn{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:20px;padding:6px 12px;border:none;font-family:inherit;cursor:pointer;font-size:13px;color:var(--text);transition:background .2s}
.user-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover}

/* ── SCROLL ── */
.scroll{position:fixed;top:var(--hh);left:0;right:0;bottom:72px;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--bg);display:none}
.scroll.show{display:block}
.scroll::-webkit-scrollbar{display:none}
.content{padding:16px 16px 32px;max-width:600px;margin:0 auto}

/* ── SAVE BAR ── */
.save-bar{position:fixed;bottom:0;left:0;right:0;z-index:300;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border);display:none;transition:border-color .25s}
.save-bar.show{display:block}
.save-btn{width:100%;padding:16px;border-radius:14px;background:var(--blue);color:#fff;border:none;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.save-btn:active{opacity:.75}
.save-btn:disabled{opacity:.5}

/* ── DATE ROW ── */
.date-row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.date-nav{width:38px;height:38px;border-radius:50%;background:var(--s2);border:none;font-size:20px;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;transition:background .15s}
.date-nav:active{opacity:.5}
.date-display{flex:1;text-align:center;cursor:pointer}
.date-main{font-size:17px;font-weight:700;color:var(--text)}
.date-sub{font-size:12px;color:var(--blue);margin-top:2px}

/* ── SECTION LABEL ── */
.sec{font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:16px 4px 8px}
.sec:first-child{padding-top:4px}

/* ── CARD ── */
.card{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}

/* ── EMP ROW ── */
.emp-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--b2);gap:12px}
.emp-row:last-child{border-bottom:none}
.emp-name{flex:1;font-size:16px;color:var(--text)}
.emp-absent-btn{
  width:36px;height:36px;border-radius:50%;border:2px solid var(--s2);
  background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--t4);transition:all .15s;flex-shrink:0;
}
.emp-absent-btn.active{border-color:var(--red);background:rgba(255,59,48,.1);color:var(--red)}

/* ── EXPENSE ROW ── */
.exp-row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--b2);gap:12px}
.exp-row:last-child{border-bottom:none}
.exp-name{flex:1;font-size:15px;color:var(--text)}
.exp-input{
  width:110px;text-align:right;padding:8px 10px;
  background:var(--s2);border:none;border-radius:10px;
  font-size:15px;color:var(--text);font-family:inherit;
  transition:background .15s;
}
.exp-input:focus{outline:none;background:var(--s3);border:1.5px solid var(--blue)}
.exp-input.has-value{background:rgba(0,122,255,.08);color:var(--blue);font-weight:600}
body.dark .exp-input{color:var(--text)}

/* ── FIELD ROW ── */
.field-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--b2)}
.field-row:last-child{border-bottom:none}
.field-label{font-size:15px;color:var(--text)}
.field-input{
  width:130px;text-align:right;padding:8px 10px;
  background:var(--s2);border:none;border-radius:10px;
  font-size:15px;color:var(--text);font-family:inherit;
  transition:background .15s;
}
.field-input:focus{outline:none;background:var(--s3);border:1.5px solid var(--blue)}
.field-input.has-value{background:rgba(0,122,255,.08);color:var(--blue);font-weight:600}
.field-input.wide{width:100%;text-align:left;padding:10px 12px;margin-top:4px}
body.dark .field-input{color:var(--text)}

/* ── INKASS RESULT ── */
.ink-result{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(255,149,0,.08);border-top:1px solid var(--b2)}
.ink-result-label{font-size:14px;font-weight:600;color:var(--orange)}
.ink-result-val{font-size:22px;font-weight:700;color:var(--orange);letter-spacing:-.4px}

/* ── KASSA GRID ── */
.kassa-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--b2)}
.kassa-cell{background:var(--surface);padding:12px 14px}
.kassa-cell-label{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.kassa-cell-val{font-size:18px;font-weight:700;letter-spacing:-.3px}
.kassa-result{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(0,122,255,.06);border-top:1px solid var(--b2)}
.kassa-result-label{font-size:14px;font-weight:600;color:var(--blue)}
.kassa-result-val{font-size:22px;font-weight:700;color:var(--blue);letter-spacing:-.5px}

/* ── EXTRA BLOCK ── */
.extra-block{padding:12px 16px;border-bottom:1px solid var(--b2)}
.extra-block:last-child{border-bottom:none}
.extra-row{display:flex;gap:10px;align-items:center}
.extra-comment{width:100%;padding:10px 12px;background:var(--s2);border:none;border-radius:10px;font-size:14px;color:var(--text);font-family:inherit;margin-top:8px;resize:none}
.extra-comment:focus{outline:none;border:1.5px solid var(--blue);background:var(--s3)}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(72px + 12px);left:16px;right:16px;z-index:9999;background:#1c1c1e;color:#fff;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:500;text-align:center;transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#1c3a1c;color:var(--green)}
.toast.error{background:#3a1c1c;color:var(--red)}

/* ── LOADING OVERLAY ── */
.loading-overlay{position:fixed;inset:0;z-index:600;background:rgba(242,242,247,.85);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
body.dark .loading-overlay{background:rgba(28,28,30,.85)}
.loading-overlay.hidden{display:none}
.big-spinner{width:44px;height:44px;border:3px solid var(--s2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:16px;color:var(--t3);font-weight:500}
.spinner{width:24px;height:24px;border:2.5px solid var(--s2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:0 0 32px;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,0,.67,0);max-height:92vh;overflow-y:auto}
.overlay.open .sheet{transform:translateY(0);transition:transform .32s cubic-bezier(.16,1,.3,1)}
.handle{width:36px;height:4px;background:var(--s2);border-radius:2px;margin:12px auto 0}
.sh-title{font-size:17px;font-weight:700;text-align:center;padding:13px 20px 0;color:var(--text)}

/* ── REAUTH ── */
#reauthOverlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:32px}
#reauthOverlay>div{background:var(--surface);border-radius:20px;padding:28px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}

/* ── SUMMARY MODAL ── */
.sum-row{display:flex;justify-content:space-between;padding:9px 0;font-size:15px;border-bottom:1px solid var(--b2)}
.sum-row:last-child{border-bottom:none}
.sum-total-block{margin-top:12px;padding:14px;background:var(--s3);border-radius:12px}

/* ── CAL ── */
.cdl{text-align:center;font-size:10px;font-weight:600;color:var(--t4);padding:3px 0 6px;text-transform:uppercase}

@media(min-width:600px){.content{padding:20px 28px 32px}}
</style>
</head>

<script>
// ─── STATE ───
let accessToken=null;
let currentDate=new Date();
let sheetData=null;
let isFirstDay=false;
// Per-day state
let absentSet=new Set();     // names of absent employees
let otherExp={};             // {name: amount}
let extraSum=0,extraComment='';
let inkSum=0,inkExpense=0,inkReason='';
let kassaIncome=0,kassaOpen=0;

// ─── LOGO / THEME ───
function applyLogos(){
  const dark=document.body.classList.contains('dark'),f=dark?'invert(1)':'none';
  ['splashLogo','loginLogo'].forEach(id=>{const el=g(id);if(el){el.src=LOGO_URI;el.style.filter=f;}});
}
function applyThemeStyles(){
  const dark=document.body.classList.contains('dark');
  const hbg=dark?'rgba(28,28,30,.96)':'rgba(242,242,247,.95)';
  const sbg=dark?'rgba(28,28,30,.97)':'rgba(248,248,252,.97)';
  [g('mainHeader'),g('saveBar')].forEach(el=>{if(el)el.style.background=hbg;});
}
function toggleDark(){
  document.body.classList.toggle('dark');
  const isDark=document.body.classList.contains('dark');
  try{localStorage.setItem('so_mgr_dark',isDark?'1':'0');}catch(e){}
  g('darkBtn').textContent=isDark?'☀️':'🌙';
  const lb=g('loginDarkBtn');if(lb)lb.textContent=isDark?'☀️ Светлая тема':'🌙 Тёмная тема';
  applyLogos();applyThemeStyles();
}
(function(){
  try{if(localStorage.getItem('so_mgr_dark')==='1')document.body.classList.add('dark');}catch(e){}
  applyLogos();applyThemeStyles();
  const isDark=document.body.classList.contains('dark');
  const b=g('darkBtn');if(b)b.textContent=isDark?'☀️':'🌙';
  const lb=g('loginDarkBtn');if(lb)lb.textContent=isDark?'☀️ Светлая тема':'🌙 Тёмная тема';
})();

// ─── SPLASH ───
window.addEventListener('load',()=>{
  applyLogos();applyThemeStyles();
  setTimeout(()=>{
    const sp=g('splash');sp.classList.add('hide');
    setTimeout(()=>{
      sp.style.display='none';
      // Check saved token
      try{
        const exp=parseInt(localStorage.getItem('so_token_exp')||'0');
        if(exp>Date.now()){
          const pic=localStorage.getItem('so_user_pic')||'';

          if(pic){const av=g('userAvatar');if(av)av.src=pic;}

          showApp();return;
        }
      }catch(e){}
      g('loginScreen').style.display='flex';
      applyLogos();
    },400);
  },900);
});

// ─── FIND FIRST UNFILLED DAY ───
async function findFirstUnfilledDay(){
  try{
    const now=new Date();
    const sn=getSheetName(now);
    // Try to load sheet
    const range=encodeURIComponent("'"+sn+"'");
    const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE`);
    const data=await res.json();
    const rows=data.values||[];
    // Scan KASSA rows for last filled income/expense
    const{rowStart,rowEnd,colDate,colIncome,colExpense}=CFG.KASSA;
    let lastFilledDate=null;
    for(let r=rowStart;r<=Math.min(rowEnd,rows.length-1);r++){
      const date=(rows[r]||[])[colDate];
      if(!date&&date!==0)continue;
      const ds=serialToDate(date);if(!ds)continue;
      const inc=parseFloat((rows[r]||[])[colIncome]||0)||0;
      const exp=parseFloat((rows[r]||[])[colExpense]||0)||0;
      if(inc>0||exp>0)lastFilledDate=ds;
    }
    if(!lastFilledDate)return now;
    // Return next day after last filled
    const p=lastFilledDate.split('.');
    const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
    d.setDate(d.getDate()+1);
    // Don't go beyond today
    if(d>now)return now;
    return d;
  }catch(e){return new Date();}
}

// ─── INIT STATE ───
function initState(){
  absentSet=new Set();
  otherExp={};
  OTHER_EXPENSES.forEach(n=>otherExp[n]='');
  extraSum=0;extraComment='';
  inkSum=0;inkExpense=0;inkReason='';
  kassaIncome=0;kassaOpen=0;
  isFirstDay=(currentDate.getDate()===1);
  const sn=getSheetName(currentDate);
  g('headerDate').textContent=formatDate(currentDate);
}

function getSheetName(d){return MRU[d.getMonth()]+' '+d.getFullYear();}
function formatDate(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}

// ─── LOAD SHEET ───
async function loadSheetAndRender(){
  showLoading('Загружаем данные...');
  try{
    const sn=getSheetName(currentDate);
    const range=encodeURIComponent("'"+sn+"'");
    const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE`);
    const data=await res.json();
    sheetData=data.values||[];
    // Auto-fill kassa open for 1st day
    if(isFirstDay&&!kassaOpen)await autoFillKassaOpen();
    prefillFromSheet();
    hideLoading();
    renderForm();
  }catch(e){
    hideLoading();
    if(e.message&&(e.message.includes('401')||e.message.includes('403'))){showReAuth();}
    else{showToast('Ошибка загрузки: '+e.message,'error');renderForm();}
  }
}

// ─── PREFILL FROM SHEET ───
function prefillFromSheet(){
  if(!sheetData)return;
  const dateStr=formatDate(currentDate);
  // Find day block
  const block=findDayBlock(sheetData,dateStr);
  if(block){
    const{blockRow:br,blockCol:bc}=block;
    // Employees
    for(let dr=br+2;dr<br+2+EMPLOYEES.length+5&&dr<sheetData.length;dr++){
      const name=String((sheetData[dr]||[])[bc]||'').trim();
      if(!name||name.toLowerCase().includes('итого'))break;
      const chk=(sheetData[dr]||[])[bc+2];
      const absent=chk===true||chk===1||String(chk).toLowerCase()==='true';
      if(absent&&EMPLOYEES.includes(name))absentSet.add(name);
    }
    // Other expenses
    for(let dr=br+2;dr<br+35&&dr<sheetData.length;dr++){
      const name=String((sheetData[dr]||[])[bc]||'').trim();
      if(!name||name.toLowerCase().includes('итого'))continue;
      if(OTHER_EXPENSES.includes(name)){
        const sum=(sheetData[dr]||[])[bc+1];
        if(name==='Экстра'&&sum){extraSum=pf(sum);}
        else if(sum)otherExp[name]=pf(sum)||'';
      }
    }
  }
  // Kassa
  const{rowStart:ks,rowEnd:ke,colDate:kd,colIn:ko,colIncome:ki}=CFG.KASSA;
  for(let r=ks;r<=Math.min(ke,sheetData.length-1);r++){
    const raw=(sheetData[r]||[])[kd];if(!raw&&raw!==0)continue;
    if(serialToDate(raw)===formatDate(currentDate)){
      const eO=(sheetData[r]||[])[ko];const eI=(sheetData[r]||[])[ki];
      if(eO)kassaOpen=pf(eO);if(eI)kassaIncome=pf(eI);break;
    }
  }
  // Inkass
  const{rowStart:is,rowEnd:ie,colDate:id2,colSum:isum,colExpense:iexp,colReason:irs}=CFG.INKASS;
  for(let r=is;r<=Math.min(ie,sheetData.length-1);r++){
    const raw=(sheetData[r]||[])[id2];if(!raw&&raw!==0)continue;
    if(serialToDate(raw)===formatDate(currentDate)){
      const s=(sheetData[r]||[])[isum];const ex=(sheetData[r]||[])[iexp];const re=(sheetData[r]||[])[irs];
      if(s)inkSum=pf(s);if(ex)inkExpense=pf(ex);if(re)inkReason=String(re).trim();break;
    }
  }
}

// ─── AUTO-FILL KASSA OPEN ───
async function autoFillKassaOpen(){
  try{
    const prevDate=new Date(currentDate.getFullYear(),currentDate.getMonth()-1,1);
    const prevSn=getSheetName(prevDate);
    const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?key=${API_KEY}&fields=sheets.properties.title`);
    const d=await res.json();
    if(!(d.sheets||[]).some(s=>s.properties.title===prevSn))return;
    const pr=encodeURIComponent("'"+prevSn+"'");
    const pres=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${pr}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE`);
    const pd=await pres.json();
    const prevRows=pd.values||[];
    const{rowStart,rowEnd,colDate,colBalance}=CFG.KASSA;
    for(let r=Math.min(rowEnd,prevRows.length-1);r>=rowStart;r--){
      const raw=(prevRows[r]||[])[colDate];if(!raw&&raw!==0)continue;
      const ds=serialToDate(raw);if(!ds)continue;
      const val=(prevRows[r]||[])[colBalance];
      if(val!==undefined&&val!==''&&val!==null){kassaOpen=Math.round(pf(val)*100)/100;break;}
    }
  }catch(e){}
}

// ─── FIND DAY BLOCK ───
function findDayBlock(rows,dateStr){
  for(let r=0;r<Math.min(200,rows.length);r++){
    const row=rows[r]||[];
    for(let c=0;c<row.length;c++){if(String(row[c]||'').includes(dateStr))return{blockRow:r,blockCol:c};}
  }
  return null;
}

// ─── LIVE UPDATE ───
function toggleAbsent(name){
  if(absentSet.has(name))absentSet.delete(name);else absentSet.add(name);
  // Re-render just that button
  document.querySelectorAll('.emp-absent-btn').forEach(btn=>{
    const row=btn.closest('.emp-row');
    const nm=row.querySelector('.emp-name').textContent;
    const absent=absentSet.has(nm);
    btn.className='emp-absent-btn'+(absent?' active':'');
    btn.textContent=absent?'✗':'';
  });
}

function updateKassa(){
  const exp=OTHER_EXPENSES.reduce((s,n)=>s+(n==='Экстра'?pf(extraSum):pf(otherExp[n]||0)),0);
  const open=pf(kassaOpen||0);const inc=pf(kassaIncome||0);const bal=open+inc-exp;
  if(g('kassaExpVal'))g('kassaExpVal').textContent='€'+fv(exp);
  if(g('kassaOpenVal'))g('kassaOpenVal').textContent='€'+fv(open);
  if(g('kassaIncomeVal'))g('kassaIncomeVal').textContent='€'+fv(inc);
  if(g('kassaBalVal'))g('kassaBalVal').textContent='€'+fv(bal);
  if(g('kassaResultVal'))g('kassaResultVal').textContent='€'+fv(bal);
}
function updateInkTotal(){
  const total=pf(inkSum)+pf(inkExpense);
  if(g('inkTotalVal'))g('inkTotalVal').textContent='€'+fv(total);

  html+=`<div class="sum-total-block">
    <div class="sum-row" style="border-bottom:1px solid var(--b2)"><span style="color:var(--t3);font-size:14px">Итого расход</span><span style="font-weight:700;color:var(--red)">€${fv(exp)}</span></div>
    <div class="sum-row" style="border-bottom:1px solid var(--b2)"><span style="color:var(--t3);font-size:14px">Доход</span><span style="font-weight:700;color:var(--green)">€${fv(kassaIncome)}</span></div>
    <div style="display:flex;justify-content:space-between;padding-top:10px"><span style="font-weight:700;font-size:16px">Касса</span><span style="font-weight:800;font-size:18px;color:${isNeg?'var(--red)':'var(--blue)'}">€${fv(kassaBal)}</span></div>
  </div>`;
  if(isNeg)html+=`<div style="margin-top:10px;padding:12px 14px;background:rgba(255,59,48,.1);border-radius:12px;display:flex;align-items:center;gap:10px"><span style="font-size:22px">⚠️</span><span style="color:var(--red);font-size:14px;font-weight:600">Касса отрицательная! Проверьте данные.</span></div>`;
  html+=`</div>`;

  g('summaryContent').innerHTML=html;
  g('summaryModal').classList.add('open');
}

function readFromDOM(){
  // Read all input values from DOM (avoids stale JS vars)
  document.querySelectorAll('[data-field]').forEach(el=>{
    const f=el.dataset.field;
    const v=el.value||'';
    if(f==='kassaIncome')kassaIncome=pf(v.replace(',','.'));
    else if(f==='kassaOpen')kassaOpen=pf(v.replace(',','.'));
    else if(f==='inkSum')inkSum=pf(v.replace(',','.'));
    else if(f==='inkExpense')inkExpense=pf(v.replace(',','.'));
    else if(f==='inkReason')inkReason=v;
    else if(f==='extraSum')extraSum=pf(v.replace(',','.'));
    else if(f==='extraComment')extraComment=v;
    else if(f.startsWith('exp_')){const n=f.slice(4);if(OTHER_EXPENSES.includes(n))otherExp[n]=v.replace(',','.');}
  });
}

async function confirmSave(){
  g('summaryModal').classList.remove('open');
  await saveData();
}

// ─── SAVE ───
async function saveData(){
  if(!await checkAuth())return;
  showLoading('Сохраняем...');
  readFromDOM();
  try{
    const dateStr=formatDate(currentDate);
    const sn=getSheetName(currentDate);
    // Reload fresh
    const range=encodeURIComponent("'"+sn+"'");
    const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE`);
    const data=await res.json();
    const rows=data.values||[];
    const updates=[];

    // ── Day block: employees + other expenses ──
    const block=findDayBlock(rows,dateStr);
    if(block){
      const{blockRow:br,blockCol:bc}=block;
      // Scan all rows in block
      for(let dr=br+2;dr<br+35&&dr<rows.length;dr++){
        const name=String((rows[dr]||[])[bc]||'').trim();
        if(!name||name.toLowerCase().includes('итого'))break;
        if(EMPLOYEES.includes(name)){
          const absent=absentSet.has(name)?true:false;
          updates.push({range:`'${sn}'!${col(bc+2)}${dr+1}`,values:[[absent]]});
        } else if(OTHER_EXPENSES.includes(name)){
          let sum=0;
          if(name==='Экстра')sum=pf(extraSum);
          else sum=pf(otherExp[name]||0);
          updates.push({range:`'${sn}'!${col(bc+1)}${dr+1}`,values:[[sum||0]]});
          // Extra comment — write to adjacent cell
          if(name==='Экстра'&&extraComment){
            updates.push({range:`'${sn}'!${col(bc+3)}${dr+1}`,values:[[extraComment]]});
          }
        }
      }
    }

    // ── KASSA block ──
    const{rowStart:ks,rowEnd:ke,colDate:kd,colIn:ko,colIncome:ki}=CFG.KASSA;
    for(let r=ks;r<=Math.min(ke,rows.length-1);r++){
      const raw=(rows[r]||[])[kd];if(!raw&&raw!==0)continue;
      if(serialToDate(raw)===dateStr){
        if(kassaIncome>0)updates.push({range:`'${sn}'!${col(ki)}${r+1}`,values:[[kassaIncome]]});
        if(isFirstDay&&kassaOpen>0)updates.push({range:`'${sn}'!${col(ko)}${r+1}`,values:[[kassaOpen]]});
        break;
      }
    }

    // ── INKASS block ──
    const{rowStart:is,rowEnd:ie,colDate:id2,colSum:isum,colExpense:iexp,colReason:irs}=CFG.INKASS;
    for(let r=is;r<=Math.min(ie,rows.length-1);r++){
      const raw=(rows[r]||[])[id2];if(!raw&&raw!==0)continue;
      if(serialToDate(raw)===dateStr){
        if(inkSum>0)updates.push({range:`'${sn}'!${col(isum)}${r+1}`,values:[[inkSum]]});
        if(inkExpense>0)updates.push({range:`'${sn}'!${col(iexp)}${r+1}`,values:[[inkExpense]]});
        if(inkReason)updates.push({range:`'${sn}'!${col(irs)}${r+1}`,values:[[inkReason]]});
        break;
      }
    }

    if(updates.length>0){
      const batchRes=await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values:batchUpdate`,
        {method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},
         body:JSON.stringify({valueInputOption:'USER_ENTERED',data:updates})}
      );
      const bd=await batchRes.json();
      if(bd.error)throw new Error(bd.error.message);
    }

    hideLoading();
    showToast('✅ Смена сохранена!','success');
    sheetData=null; // clear cache so next load fetches fresh
  }catch(e){
    hideLoading();
    if(e.message&&(e.message.includes('401')||e.message.includes('403'))){showReAuth();}
    else{showToast('❌ Ошибка: '+e.message,'error');}
  }
}

// ─── HISTORY ───
async function openHistory(){
  g('historyModal').classList.add('open');
  g('historyList').innerHTML='<div style="padding:32px;text-align:center;color:var(--t4)"><div class="spinner" style="margin:0 auto 12px"></div>Загрузка...</div>';
  try{
    const sn=getSheetName(currentDate);
    const rows=sheetData||[];
    const{rowStart,rowEnd,colDate,colIncome,colExpense,colBalance}=CFG.KASSA;
    const items=[];
    for(let r=rowStart;r<=Math.min(rowEnd,rows.length-1);r++){
      const raw=(rows[r]||[])[colDate];if(!raw&&raw!==0)continue;
      const ds=serialToDate(raw);if(!ds)continue;
      const inc=pf((rows[r]||[])[colIncome]);const exp=pf((rows[r]||[])[colExpense]);const bal=pf((rows[r]||[])[colBalance]);
      if(inc>0||exp>0||bal>0)items.push({ds,inc,exp,bal});
    }
    items.reverse();
    if(!items.length){g('historyList').innerHTML='<div style="padding:32px;text-align:center;color:var(--t4)">Нет данных</div>';return;}
    g('historyList').innerHTML=items.map(it=>`
      <div style="padding:13px 18px;border-bottom:1px solid var(--b2);display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:15px;font-weight:600;color:var(--text)">${it.ds}</div><div style="font-size:12px;color:var(--t3);margin-top:3px">Доход: €${fv(it.inc)} · Расход: €${fv(it.exp)}</div></div>
        <div style="text-align:right"><div style="font-size:17px;font-weight:700;color:${it.bal<0?'var(--red)':it.bal<100?'var(--orange)':'var(--blue)'}">€${fv(it.bal)}</div><div style="font-size:11px;color:var(--t4)">касса</div></div>
      </div>`).join('');
  }catch(e){g('historyList').innerHTML=`<div style="padding:32px;text-align:center;color:var(--red)">Ошибка: ${e.message}</div>`;}
}

// ─── COPY REPORT ───
function copyReport(){
  readFromDOM();
  const dateStr=formatDate(currentDate);
  const exp=OTHER_EXPENSES.reduce((s,n)=>s+(n==='Экстра'?pf(extraSum):pf(otherExp[n]||0)),0);
  const kassaBal=pf(kassaOpen)+pf(kassaIncome)-exp;
  let lines=[`*${dateStr}*`,`*Доход:* €${fv(kassaIncome)}`,`*Расход:* −€${fv(exp)}`,`*Касса:* €${fv(kassaBal)}`,''];
  if(absentSet.size>0)lines.push(`*Отсутствуют:* `+[...absentSet].join(', '));
  const filled=OTHER_EXPENSES.filter(n=>n!=='Экстра'&&pf(otherExp[n]||0)>0);
  if(filled.length){lines.push('');lines.push('*Расходы:*');filled.forEach(n=>lines.push(`${n}: €${fv(otherExp[n])}`));}
  if(extraSum>0)lines.push(`Экстра: €${fv(extraSum)}${extraComment?' ('+extraComment+')':''}`);
  if(inkSum>0||inkExpense>0){lines.push('');lines.push(`*Инкассация:* приход €${fv(inkSum)} / расход €${fv(inkExpense)}${inkReason?' — '+inkReason:''}`)}
  const text=lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showToast('✅ Отчёт скопирован!','success')).catch(()=>fallbackCopy(text));}
  else fallbackCopy(text);
}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');showToast('✅ Скопировано!','success');}catch(e){showToast('Скопируйте вручную','error');}document.body.removeChild(ta);}

// ─── UTILS ───
function g(id){return document.getElementById(id);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fv(v){const n=pf(v);return isNaN(n)?'0,00':n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pf(v){const n=parseFloat(String(v||0).replace(',','.'));return isNaN(n)?0:n;}
function col(idx){let s='';idx+=1;while(idx>0){const r=(idx-1)%26;s=String.fromCharCode(65+r)+s;idx=Math.floor((idx-1)/26);}return s;}
function showLoading(txt){if(g('loadingText'))g('loadingText').textContent=txt||'Загрузка...';if(g('loadingOverlay'))g('loadingOverlay').classList.remove('hidden');}
function hideLoading(){if(g('loadingOverlay'))g('loadingOverlay').classList.add('hidden');}
function showToast(msg,type=''){const t=g('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.className='toast',3000);}
function serialToDate(raw){
  if(raw===null||raw===undefined||raw==='')return'';
  let s=String(raw).trim();
  if(/^\d{2}\.\d{2}\.\d{4}$/.test(s))return s;
  if(/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(s)){const p=s.split('.');return p[0].padStart(2,'0')+'.'+p[1].padStart(2,'0')+'.'+p[2];}
  if(s.indexOf(' - ')>=0)return serialToDate(s.split(' - ')[0].trim());
  if(s.indexOf(' – ')>=0)return serialToDate(s.split(' – ')[0].trim());
  const n=parseInt(s);
  if(!isNaN(n)&&n>40000&&n<60000){const dt=new Date((n-25569)*86400*1000);return String(dt.getUTCDate()).padStart(2,'0')+'.'+String(dt.getUTCMonth()+1).padStart(2,'0')+'.'+dt.getUTCFullYear();}
  const dt2=new Date(s);
  if(!isNaN(dt2.getTime()))return String(dt2.getDate()).padStart(2,'0')+'.'+String(dt2.getMonth()+1).padStart(2,'0')+'.'+dt2.getFullYear();
  return s;
}
